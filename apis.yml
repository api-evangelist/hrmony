aid: hrmony
name: Hrmony
description: >-
  Hrmony is a Berlin-based employee-benefits platform that lets German employers
  offer modern, tax-advantaged perks to their staff — meal allowances
  (Essenszuschuss), the 50 euro monthly non-cash benefit (Sachbezug) and benefit
  card, mobility and public-transit budgets, health and recreation benefits,
  internet-cost subsidies and digital gifts — all managed through an admin
  portal and employee app with built-in payroll and tax compliance. Its Hrmony
  Embedded product exposes this benefits infrastructure as a white-label RESTful
  API so software platforms and SaaS providers can integrate multiple benefit
  modules without building the tax-compliance, operations or regulatory layer
  in-house. Hrmony is backed by Techstars. This API Evangelist profile was
  enriched from the company's public web surface; no public developer
  documentation or OpenAPI is currently published (Embedded onboarding is
  partner-gated).
